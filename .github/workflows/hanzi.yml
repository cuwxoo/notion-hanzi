name: Notion Hanzi

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # chạy 4 lần mỗi giờ, lệch khỏi mốc đầu giờ
  workflow_dispatch:                # bấm Run workflow để chạy ngay

permissions:
  contents: read

concurrency:
  group: notion-hanzi
  cancel-in-progress: false         # không cho hai lần chạy chồng nhau

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install requests

      - name: Chạy script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          echo "Bắt đầu lúc: $(date -u)"
          python notion_hanzi.py
